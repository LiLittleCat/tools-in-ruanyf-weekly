name: Build Check

# 站点由 Cloudflare Pages 发布，生产分支为 master：
#   - 旧版 Java CI（ci.yml）每周五 09:00 北京时间向 master 推送 "Update contents"，
#     该 push 自动触发 Cloudflare 重新构建，构建时克隆最新周刊源 → 新站同步更新
#   - 平时开发在 fumadocs 分支，合并到 master 即发布
#
# 这个 workflow 只做构建检查，提前发现构建错误。

on:
  workflow_dispatch:
  push:
    branches: [fumadocs]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build = 克隆最新周刊源 + 生成内容 + astro 构建 + pagefind 全文索引
      - run: pnpm build
